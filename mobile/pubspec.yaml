name: tikets
description: Aplicación móvil para gestión de incidencias técnicas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: 6.1.5
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  get: ^4.7.3
  http: ^1.6.0
  image: ^4.10.0
  image_picker: ^1.2.1
  path: ^1.9.1
  sqflite: ^2.4.2+1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ">=2.3.7 <2.4.0"

flutter:
  uses-material-design: true
