# Solo endpoints de metadatos necesarios para cAdvisor; sin logs, archive, exec ni escrituras.
global
    log stdout format raw local0 warning
    maxconn 256

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend docker_consulta
    bind :2375
    acl lectura method GET HEAD
    acl permitido path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|info|events|containers/json|containers/[A-Za-z0-9_.-]+/json)$
    http-request deny unless lectura permitido
    default_backend docker_local

backend docker_local
    server motor /var/run/docker.sock
