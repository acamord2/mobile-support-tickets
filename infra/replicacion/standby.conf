# Configuración de la copia física; nunca se monta en el primario.
listen_addresses = '*'
port = 5432
hot_standby = on
hot_standby_feedback = off
max_standby_streaming_delay = '30s'
primary_conninfo = 'host=postgres port=5432 user=replicador_lectura application_name=postgres_lectura passfile=/run/secrets/replicacion.pgpass'
primary_slot_name = 'slot_postgres_lectura'
recovery_target_timeline = 'latest'
restore_command = ''
archive_mode = off
hba_file = '/opt/replicacion/pg_hba_standby.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
